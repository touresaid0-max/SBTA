# =============================================================================
# SBTA — règles de cache nginx pour sbta-gestion.cloud (VPS)
#
# À COPIER dans le bloc « server { … } » HTTPS existant du site (fichier dans
# /etc/nginx/sites-available/ ou /etc/nginx/conf.d/), à la place du bloc
# « location / { … } » actuel. Garder les lignes server_name, root, ssl_* existantes.
#
# Principe :
#   - /assets/* : fichiers dont le nom contient une empreinte (index-DnditqKc.js…).
#     Une nouvelle version porte un nouveau nom : on peut les garder un an.
#   - index.html, sw.js, registerSW.js, manifestes : toujours revérifiés, sinon
#     les postes ne verraient pas les nouvelles versions après un déploiement.
#   - images et icônes : 7 jours.
#
# Attention (nginx) : une directive add_header dans un bloc location remplace celles
# du bloc server. Si le bloc server définit des en-têtes de sécurité (X-Frame-Options…),
# les recopier dans chaque location ci-dessous.
# =============================================================================

# HTTP/2 : plusieurs fichiers téléchargés en parallèle sur une seule connexion
# (l'application est maintenant découpée en pages chargées à la demande).
#   nginx >= 1.25.1 : ajouter dans le bloc server :   http2 on;
#   nginx plus ancien : remplacer « listen 443 ssl; » par « listen 443 ssl http2; »

# Fichiers versionnés par empreinte : cache un an, jamais revérifiés
location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

# workbox-<empreinte>.js : versionné lui aussi
location ~ ^/workbox-[A-Za-z0-9_-]+\.js$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# Service workers et manifestes : toujours revérifiés (détection des nouvelles versions)
location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest|login/sw\.js|login/manifest\.webmanifest)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
}

# Images, icônes, polices : 7 jours
location ~* \.(png|jpe?g|gif|svg|ico|webp|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800" always;
}

# Application (routes React) : index.html toujours revérifié
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
}
