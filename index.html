<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      Old version left on the device after a redeploy: its files no longer exist on the server,
      the app cannot start and the page stays blank. Written here, outside the app's code, so that
      it still runs when that code fails to load: the stored copy of the app is dropped (service
      worker and its cache; the guichet's data in IndexedDB is not touched) and the page reloaded
      once from the server. If it fails again, a message replaces the blank page.
    -->
    <script>
      (function () {
        var KEY = 'sbta_boot_recover';
        function flagged() { try { return sessionStorage.getItem(KEY) === '1'; } catch (e) { return true; } }
        function showMessage() {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          root.innerHTML =
            '<div style="font-family:system-ui,sans-serif;max-width:420px;margin:15vh auto;padding:24px;text-align:center;border:1px solid #D5DCD8;border-radius:12px">' +
            '<p style="font-weight:700;font-size:18px;color:#0B7439;margin:0 0 8px">Mise à jour de l’application</p>' +
            '<p style="color:#5B6670;font-size:14px;margin:0 0 16px">Une nouvelle version est disponible. Rechargez pour continuer (connexion Internet nécessaire).</p>' +
            '<button id="sbta-reload" style="background:#0B7439;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer">Recharger</button></div>';
          document.getElementById('sbta-reload').onclick = function () {
            try { sessionStorage.removeItem(KEY); } catch (e) { /* ignore */ }
            recover(true);
          };
        }
        function recover(force) {
          // Offline, the stored copy is the only one: keep it
          if (!navigator.onLine) { showMessage(); return; }
          if (!force && flagged()) { showMessage(); return; }
          try { sessionStorage.setItem(KEY, '1'); } catch (e) { showMessage(); return; }
          var tasks = [];
          if ('serviceWorker' in navigator) {
            tasks.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            }));
          }
          if (window.caches) {
            tasks.push(caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }));
          }
          Promise.all(tasks).catch(function () {}).then(function () { location.reload(); });
        }
        window.__sbtaRecover = recover;
        // A script or style of the app that fails to load (file of an older version)
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK') && /\/assets\//.test(t.src || t.href || '')) recover(false);
        }, true);
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SBTA Gestion — Transport Interurbain</title>
    <meta name="description" content="Plateforme de gestion du transport interurbain SBTA Group" />

    <!-- Open Graph (WhatsApp, Facebook) -->
    <meta property="og:title" content="SBTA Gestion — Transport Interurbain" />
    <meta property="og:description" content="Plateforme de gestion du transport interurbain SBTA Group" />
    <meta property="og:image" content="https://sbta-gestion.cloud/og-image.png" />
    <meta property="og:url" content="https://sbta-gestion.cloud" />
    <meta property="og:type" content="website" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SBTA Gestion — Transport Interurbain" />
    <meta name="twitter:image" content="https://sbta-gestion.cloud/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
